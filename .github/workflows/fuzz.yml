name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. The 30-minute
# total budget is split across the 9 targets (~200 s each): the four
# decode-surface targets (single-file, multichannel, correction pair,
# bounded twins), the two walker targets (introspection, seek) and the
# three encode round-trip oracles (lossless, hybrid, multichannel).
# Every target is self-contained: no external tools are needed.

on:
  schedule:
    - cron: "23 5 * * *"   # daily 05:23 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
